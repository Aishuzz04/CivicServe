<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ title }} | Administrator Panel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>


<body class="bg-gray-100 min-h-screen">

<div class="max-w-2xl mx-auto px-4 py-10">

    <!-- Back -->
    <a href="{{ url_for('departments') }}"
       class="inline-flex items-center gap-2
              text-gray-600 hover:text-blue-600
              text-sm mb-6">

        <i class="fas fa-arrow-left"></i>

        Back to Departments

    </a>


    <!-- Card -->
    <div class="bg-white rounded-xl shadow-sm
                border border-gray-100 p-6 sm:p-8">

        <div class="mb-6">

            <h1 class="text-2xl font-bold text-gray-800">

                {{ title }}

            </h1>

            <p class="text-sm text-gray-500 mt-1">

                Manage infrastructure department information.

            </p>

        </div>


        {% if error %}

        <div class="mb-5 bg-red-50 border border-red-200
                    text-red-700 px-4 py-3 rounded-lg">

            <i class="fas fa-exclamation-circle mr-2"></i>

            {{ error }}

        </div>

        {% endif %}


        <form method="POST">

            <!-- Department Name -->
            <div class="mb-5">

                <label class="block text-sm font-medium
                              text-gray-700 mb-2">

                    Department Name

                </label>

                <input type="text"
                       name="department_name"
                       required
                       value="{{ department.department_name
                                if department else '' }}"
                       placeholder="Example: Roads"
                       class="w-full px-4 py-3
                              border border-gray-300
                              rounded-lg
                              focus:outline-none
                              focus:ring-2
                              focus:ring-blue-500">

            </div>


            <!-- Description -->
            <div class="mb-6">

                <label class="block text-sm font-medium
                              text-gray-700 mb-2">

                    Description

                </label>

                <textarea name="description"
                          rows="4"
                          placeholder="Describe the responsibilities of this department..."
                          class="w-full px-4 py-3
                                 border border-gray-300
                                 rounded-lg
                                 focus:outline-none
                                 focus:ring-2
                                 focus:ring-blue-500">{{ department.description if department else '' }}</textarea>

            </div>


            <!-- Buttons -->
            <div class="flex justify-end gap-3">

                <a href="{{ url_for('departments') }}"
                   class="px-5 py-2.5
                          bg-gray-100 hover:bg-gray-200
                          text-gray-700
                          rounded-lg text-sm font-medium">

                    Cancel

                </a>


                <button type="submit"
                        class="px-5 py-2.5
                               bg-blue-600 hover:bg-blue-700
                               text-white
                               rounded-lg text-sm font-medium">

                    <i class="fas fa-save mr-2"></i>

                    {{ button_text }}

                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
