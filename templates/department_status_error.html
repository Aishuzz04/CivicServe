<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Department Status</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-lg w-full mx-4 text-center">

        <div class="w-16 h-16 mx-auto mb-5 rounded-full bg-yellow-100 flex items-center justify-center">
            <i class="fas fa-triangle-exclamation text-yellow-600 text-2xl"></i>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-3">
            Department Cannot Be Disabled
        </h1>

        <p class="text-gray-600 leading-relaxed mb-6">
            {{ message }}
        </p>

        <button
            type="button"
            onclick="history.back()"
            class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
        >
            <i class="fas fa-arrow-left mr-2"></i>
            Go Back
        </button>

    </div>

</body>
</html>
