<main class="p-4 sm:p-6 lg:p-8">
    <h2 class="text-xl font-bold text-gray-800 mb-6">Settings</h2>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 max-w-2xl space-y-6">
        <div>
            <h3 class="font-medium text-gray-800 mb-3">System Settings</h3>
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-700">Enable Email Notifications</p>
                        <p class="text-xs text-gray-500">Send email updates to citizens</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-700">Auto Assign Engineers</p>
                        <p class="text-xs text-gray-500">Automatically assign based on department</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
            </div>
        </div>

        <div class="border-t pt-6">
            <h3 class="font-medium text-gray-800 mb-3">Change Password</h3>
            <div class="space-y-3">
                <input type="password" placeholder="Current Password" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm">
                <input type="password" placeholder="New Password" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm">
                <input type="password" placeholder="Confirm New Password" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm">
                <button class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg font-medium">Update Password</button>
            </div>
        </div>
    </div>
</main>
